```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Kod Oluşturucu</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#111827;
}

.app{
  width:100%;
  max-width:700px;
  background:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  padding:13px 8px;
  border:0;
  border-radius:12px;
  background:#eef2f7;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#2563eb;
  color:white;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.title{
  display:block;
  font-weight:bold;
  margin-bottom:9px;
}

textarea{
  width:100%;
  min-height:150px;
  padding:15px;
  border:2px solid #e2e8f0;
  border-radius:14px;
  resize:vertical;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#2563eb;
}

.file-box{
  display:block;
  text-align:center;
  border:2px dashed #cbd5e1;
  border-radius:16px;
  padding:35px 15px;
  background:#f8fafc;
  cursor:pointer;
}

.file-box:hover{
  border-color:#2563eb;
  background:#eff6ff;
}

.file-box b{
  display:block;
  font-size:18px;
  margin-bottom:7px;
}

.file-box span{
  color:#64748b;
  font-size:14px;
}

input[type="file"]{
  display:none;
}

.info{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#eff6ff;
  border-radius:10px;
  font-size:14px;
  word-break:break-word;
}

video{
  display:none;
  width:100%;
  max-height:300px;
  margin-top:15px;
  border-radius:12px;
  background:#000;
}

.settings{
  margin-top:18px;
}

select{
  width:100%;
  padding:12px;
  border:2px solid #e2e8f0;
  border-radius:10px;
  background:white;
  font-size:15px;
}

.generate{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.generate:hover{
  opacity:.9;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-size:14px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fff7ed;
  color:#c2410c;
}

.result{
  text-align:center;
  border-top:1px solid #e2e8f0;
  margin-top:25px;
  padding-top:25px;
}

#qrcode{
  display:inline-block;
  padding:12px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:bold;
  cursor:pointer;
}

.download{
  background:#16a34a;
  color:white;
}

.copy{
  background:#e2e8f0;
  color:#111827;
}

.clear{
  background:#fee2e2;
  color:#dc2626;
}

@media(max-width:600px){

  .app{
    padding:20px;
  }

  .tabs{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<div class="app">

<h1>QR Kod Oluşturucu</h1>

<p class="subtitle">
Link, metin, dosya veya video için QR kod oluştur
</p>


<div class="tabs">

<button
class="tab active"
onclick="changeTab('text',this)">
Link / Metin
</button>

<button
class="tab"
onclick="changeTab('file',this)">
Dosya
</button>

<button
class="tab"
onclick="changeTab('video',this)">
Video
</button>

</div>


<!-- METİN -->

<div
id="textPanel"
class="panel active">

<label class="title">
Metin veya bağlantı
</label>

<textarea
id="textInput"
placeholder="https://ornek.com

veya istediğin bir metni yaz..."></textarea>

</div>


<!-- DOSYA -->

<div
id="filePanel"
class="panel">

<label class="title">
Dosya seç
</label>

<label
class="file-box"
for="fileInput">

<b>
Dosya seçmek için tıkla
</b>

<span>
Maksimum 1 MB
</span>

</label>

<input
id="fileInput"
type="file">

<div
id="fileInfo"
class="info">
</div>

</div>


<!-- VİDEO -->

<div
id="videoPanel"
class="panel">

<label class="title">
Video seç
</label>

<label
class="file-box"
for="videoInput">

<b>
Video seçmek için tıkla
</b>

<span>
Maksimum 1 MB
</span>

</label>

<input
id="videoInput"
type="file"
accept="video/*">

<div
id="videoInfo"
class="info">
</div>

<video
id="videoPreview"
controls>
</video>

</div>


<!-- QR AYARLARI -->

<div class="settings">

<label class="title">
QR Boyutu
</label>

<select id="qrSize">

<option value="180">
180 × 180
</option>

<option value="256" selected>
256 × 256
</option>

<option value="320">
320 × 320
</option>

<option value="400">
400 × 400
</option>

<option value="512">
512 × 512
</option>

</select>

</div>


<button
class="generate"
onclick="generateQR()">

QR Kod Oluştur

</button>


<div
id="message"
class="message">
</div>


<!-- SONUÇ -->

<div class="result">

<h2>
QR Kod
</h2>

<div id="qrcode">
</div>

<div class="actions">

<button
class="btn download"
onclick="downloadQR()">
QR'ı İndir
</button>

<button
class="btn copy"
onclick="copyContent()">
Kopyala
</button>

<button
class="btn clear"
onclick="clearAll()">
Temizle
</button>

</div>

</div>

</div>


<script>

let currentTab = "text";
let currentContent = "";


/* SEKME DEĞİŞTİR */

function changeTab(tab,button){

currentTab = tab;

document
.querySelectorAll(".panel")
.forEach(panel=>{
panel.classList.remove("active");
});

document
.querySelectorAll(".tab")
.forEach(btn=>{
btn.classList.remove("active");
});

document
.getElementById(tab+"Panel")
.classList.add("active");

button.classList.add("active");

hideMessage();

}


/* DOSYA SEÇİLDİ */

document
.getElementById("fileInput")
.addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const info =
document.getElementById("fileInfo");

info.style.display = "block";

info.innerHTML =
"<b>"+
escapeHTML(file.name)+
"</b><br>"+
"Boyut: "+
formatBytes(file.size);

});


/* VİDEO SEÇİLDİ */

document
.getElementById("videoInput")
.addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const info =
document.getElementById("videoInfo");

const video =
document.getElementById("videoPreview");

info.style.display = "block";

info.innerHTML =
"<b>"+
escapeHTML(file.name)+
"</b><br>"+
"Boyut: "+
formatBytes(file.size);

video.src =
URL.createObjectURL(file);

video.style.display = "block";

});


/* QR OLUŞTUR */

function generateQR(){

/* METİN */

if(currentTab === "text"){

const text =
document
.getElementById("textInput")
.value
.trim();

if(!text){

showMessage(
"Lütfen bir metin veya bağlantı gir.",
"warning"
);

return;

}

createQR(text);

return;

}


/* DOSYA / VİDEO */

let input;

if(currentTab === "file"){

input =
document.getElementById("fileInput");

}else{

input =
document.getElementById("videoInput");

}

const file =
input.files[0];

if(!file){

showMessage(
"Önce bir dosya veya video seç.",
"warning"
);

return;

}


/* 1 MB SINIRI */

if(file.size > 1024 * 1024){

showMessage(
"Dosya 1 MB'dan büyük. Lütfen 1 MB veya daha küçük bir dosya seç.",
"warning"
);

return;

}


/* DOSYAYI OKU */

const reader =
new FileReader();

reader.onload = function(){

createQR(reader.result);

};

reader.onerror = function(){

showMessage(
"Dosya okunamadı.",
"warning"
);

};

reader.readAsDataURL(file);

}


/* QR OLUŞTUR */

function createQR(data){

const box =
document.getElementById("qrcode");

box.innerHTML = "";

const size =
parseInt(
document.getElementById("qrSize").value
);

try{

new QRCode(box,{

text:data,

width:size,

height:size,

colorDark:"#000000",

colorLight:"#ffffff",

correctLevel:
QRCode.CorrectLevel.L

});

currentContent = data;

showMessage(
"QR kod oluşturuldu!",
"success"
);

}catch(error){

currentContent = "";

showMessage(
"Bu içerik QR kod için fazla büyük.",
"warning"
);

}

}


/* QR İNDİR */

function downloadQR(){

const canvas =
document.querySelector(
"#qrcode canvas"
);

if(!canvas){

showMessage(
"Önce QR kod oluştur.",
"warning"
);

return;

}

const link =
document.createElement("a");

link.download =
"qr-kod.png";

link.href =
canvas.toDataURL("image/png");

link.click();

}


/* KOPYALA */

async function copyContent(){

if(!currentContent){

showMessage(
"Önce QR kod oluştur.",
"warning"
);

return;

}

try{

await navigator
.clipboard
.writeText(currentContent);

showMessage(
"İçerik kopyalandı.",
"success"
);

}catch(error){

showMessage(
"Kopyalama başarısız oldu.",
"warning"
);

}

}


/* TEMİZLE */

function clearAll(){

document
.getElementById("textInput")
.value = "";

document
.getElementById("fileInput")
.value = "";

document
.getElementById("videoInput")
.value = "";

document
.getElementById("fileInfo")
.style.display = "none";

document
.getElementById("videoInfo")
.style.display = "none";

const video =
document.getElementById("videoPreview");

video.pause();

video.removeAttribute("src");

video.load();

video.style.display = "none";

document
.getElementById("qrcode")
.innerHTML = "";

currentContent = "";

hideMessage();

}


/* MESAJ */

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent = text;

box.className =
"message "+type;

box.style.display = "block";

}


function hideMessage(){

document
.getElementById("message")
.style.display = "none";

}


/* DOSYA BOYUTU */

function formatBytes(bytes){

if(bytes === 0)
return "0 Bytes";

const units =
["Bytes","KB","MB","GB"];

const i =
Math.floor(
Math.log(bytes) /
Math.log(1024)
);

return (
(bytes /
Math.pow(1024,i))
.toFixed(2)
+" "+
units[i]
);

}


/* GÜVENLİ METİN */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
```
